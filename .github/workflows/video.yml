name: Gerar vídeo

on:
  workflow_dispatch:
    inputs:
      id:
        description: "Número do roteiro (ex.: 001)"
        required: true
        default: "001"
      publicar:
        description: "Postar no YouTube?"
        type: choice
        options: [nao, privado, nao_listado, publico]
        default: nao
      agendar:
        description: "Agendar (opcional, UTC, ex.: 2026-11-12T22:00:00Z)"
        required: false
  push:
    paths: ["roteiros/[0-9][0-9][0-9].json", "roteiros/s[0-9][0-9].json"]

concurrency:
  group: video-${{ github.event.inputs.id || github.sha }}
  cancel-in-progress: false

env:
  PARTES: 8

jobs:
  preparar:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.id.outputs.id }}
      partes: ${{ steps.partes.outputs.matriz }}
      comp: ${{ steps.partes.outputs.comp }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }

      - name: Descobrir qual roteiro gerar
        id: id
        run: |
          if [ -n "${{ github.event.inputs.id }}" ]; then
            echo "id=${{ github.event.inputs.id }}" >> "$GITHUB_OUTPUT"
          else
            ID=$(git diff --name-only HEAD~1 HEAD -- 'roteiros/*.json' | grep -v meta | head -1 | xargs -r -n1 basename | cut -d. -f1)
            echo "id=$ID" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Instalar ferramentas
        timeout-minutes: 8
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          # ffmpeg estático baixado do GitHub (não depende dos servidores do Ubuntu)
          if ! command -v ffmpeg; then
            curl -sL --max-time 240 --retry 3 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
              && tar -xJf /tmp/ff.tar.xz -C /tmp && sudo cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ff* /usr/local/bin/ \
              || (sudo apt-get $APT update -qq && sudo apt-get $APT install -y -qq --no-install-recommends ffmpeg > /dev/null)
          fi
          ffmpeg -version | head -1
          pip install -q --timeout 60 edge-tts piper-tts
          mkdir -p modelos
          # voz reserva (Piper) caso o Edge TTS falhe; se o download travar, segue sem ela
          for ext in onnx onnx.json; do
            curl -sL --max-time 180 --retry 2 -o modelos/pt_BR-faber-medium.$ext https://huggingface.co/rhasspy/piper-voices/resolve/main/pt/pt_BR/faber/medium/pt_BR-faber-medium.$ext || rm -f modelos/pt_BR-faber-medium.$ext
          done

      - name: Voz e legendas
        run: python scripts/voz.py ${{ steps.id.outputs.id }}

      - name: B-roll (Pixabay)
        env: { PIXABAY_API_KEY: "${{ secrets.PIXABAY_API_KEY }}" }
        run: python scripts/broll.py ${{ steps.id.outputs.id }}

      - name: Imagens de arquivo reais (Commons e Internet Archive)
        continue-on-error: true
        timeout-minutes: 12
        run: python scripts/arquivo.py ${{ steps.id.outputs.id }}

      - name: Montar manifesto, narração e efeitos
        run: |
          python scripts/registrar.py
          python scripts/montar.py ${{ steps.id.outputs.id }}

      - name: Dividir em partes
        id: partes
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          m = json.load(open(f"public/build/${{ steps.id.outputs.id }}/manifest.json"))
          short = m.get("formato") == "short"
          tot = m["totalFrames"]
          n = 2 if short else max(1, min(16 if tot > 20000 else int(os.environ["PARTES"]), tot // 900))  # documentário longo: 16 partes
          print("comp=" + ("Short" if short else "Video"))
          passo = -(-tot // n)
          partes = [{"i": i, "de": i * passo, "ate": min(tot, (i + 1) * passo) - 1} for i in range(n) if i * passo < tot]
          print("matriz=" + json.dumps(partes))
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: public/build/${{ steps.id.outputs.id }}
          retention-days: 3

  renderizar:
    needs: preparar
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        parte: ${{ fromJson(needs.preparar.outputs.partes) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with: { name: build, path: "public/build/${{ needs.preparar.outputs.id }}" }
      - name: Renderizar parte ${{ matrix.parte.i }}
        run: |
          python3 scripts/registrar.py
          npx remotion render src/index.ts ${{ needs.preparar.outputs.comp }} out/parte_${{ matrix.parte.i }}.mp4 \
            --props=public/build/${{ needs.preparar.outputs.id }}/manifest.json \
            --frames=${{ matrix.parte.de }}-${{ matrix.parte.ate }} --muted --concurrency=100%
      - uses: actions/upload-artifact@v4
        with:
          name: parte_${{ matrix.parte.i }}
          path: out/parte_${{ matrix.parte.i }}.mp4
          retention-days: 2

  finalizar:
    needs: [preparar, renderizar]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with: { pattern: parte_*, path: out, merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { name: build, path: "public/build/${{ needs.preparar.outputs.id }}" }
      - name: Juntar partes e colocar o áudio
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          # ffmpeg estático baixado do GitHub (não depende dos servidores do Ubuntu)
          if ! command -v ffmpeg; then
            curl -sL --max-time 240 --retry 3 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
              && tar -xJf /tmp/ff.tar.xz -C /tmp && sudo cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ff* /usr/local/bin/ \
              || (sudo apt-get $APT update -qq && sudo apt-get $APT install -y -qq --no-install-recommends ffmpeg > /dev/null)
          fi
          ffmpeg -version | head -1
          ID=${{ needs.preparar.outputs.id }}
          ls out/parte_*.mp4 | sort -V | sed "s|^out/|file '|; s|$|'|" > out/lista.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i out/lista.txt -c copy out/video_mudo.mp4
          python3 scripts/mixar.py $ID out/video_mudo.mp4 out/final.mp4
          if python3 -c "import json,sys;sys.exit(0 if 'thumb' in json.load(open('roteiros/$ID.meta.json')) else 1)"; then
            python3 -c "import json;print(json.dumps(json.load(open('roteiros/$ID.meta.json'))['thumb']))" > out/thumb.json
            npx remotion still src/index.ts Thumb out/thumb.png --props=out/thumb.json
          else
            npx remotion still src/index.ts Short out/thumb.png --props=public/build/$ID/manifest.json --frame=20
          fi
          ls -la out/final.mp4 out/thumb.png

      - uses: actions/upload-artifact@v4
        with:
          name: video_final_${{ needs.preparar.outputs.id }}
          path: |
            out/final.mp4
            out/thumb.png
          retention-days: 14

      - name: Postar no YouTube
        if: github.event.inputs.publicar && github.event.inputs.publicar != 'nao'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          pip install -q google-api-python-client google-auth
          python scripts/publicar.py ${{ needs.preparar.outputs.id }} out/final.mp4 out/thumb.png \
            ${{ github.event.inputs.publicar }} ${{ github.event.inputs.agendar }}
