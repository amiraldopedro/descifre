  const chaoFer = C.terreno({ w: 120, d: 120, seg: 60, altura: 3, plano: 7, mapa: C.TEX.grama(), y: 0 }); fer.add(chaoFer);

  for (let z = -26; z < -2.5; z += .62) { const d = new THREE.Mesh(new THREE.BoxGeometry(2.3, .1, .22), madeira); d.position.set(0, .1, z); d.castShadow = d.receiveShadow = true; fer.add(d); }
  for (const x of [-.72, .72]) { const t = new THREE.Mesh(new THREE.BoxGeometry(.07, .1, 23.5), ferro); t.position.set(x, .2, -14.2); t.castShadow = true; fer.add(t); }
  // dormentes soltos esperando, empilhados

  const condutor = operario(2); condutor.position.set(.6, .32, .2); condutor.rotation.y = Math.PI / 2; condutor.partes.pernas.forEach(p => p.rotation.x = -1.45); carroca.add(condutor);
  const lampE = C.lampiao({ forca: 4, alcance: 6, sombra: false, seed: 5 }); lampE.position.set(.95, 1.25, -.5); carroca.add(lampE);
  { const haste = new THREE.Mesh(new THREE.BoxGeometry(.04, .9, .04), cerca); haste.position.set(.95, 1.0, -.55); carroca.add(haste); }

  for (const [x, w] of [[-2.6, 4], [2.6, 4]]) { const p = new THREE.Mesh(new THREE.BoxGeometry(w, 3.2, .2), tabTav); p.position.set(x, 1.6, 0); p.castShadow = p.receiveShadow = true; tav.add(p); }

    tit: { grupo: tit, fundo: new THREE.Color('#020203'), nevoa: ['#020203', 3, 10], expo: 1.0 },
  };

  // ════════════ PLANOS (câmera por plano; vert = Short 9:16) ════════════
  const fov = f => VERT ? Math.min(75, f * 1.75) : f;
  const TIROS = {
    escuro_barra: p => ({ cena: 'noite', de: { pos: [.75, .45, 1.6], alvo: [0, .55, 0], fov: fov(30) }, ate: { pos: [.38, .8, .85], alvo: [0, .8, -.05], fov: fov(28) }, ease: 'lento', mao: .3, fadeIn: .6 }),
    barra_voa: p => ({ cena: 'ceu', de: { pos: [-.6, 1.0, 2.6], alvo: [-.6, 1.6, -1], fov: fov(38) }, ate: { pos: [1.6, 3.4, 1.4], alvo: [2.2, 4.4, -2.6], fov: fov(38) }, ease: 'linear', mao: .6, voo: 1 }),
    barra_voa2: p => ({ cena: 'ceu', de: { pos: [0, .4, 4.2], alvo: [0, 2.4, -1.5], fov: fov(44) }, ate: { pos: [.6, .6, 3.8], alvo: [1, 3.2, -2], fov: fov(44) }, ease: 'linear', mao: .7, voo: 2 }),
    carroca: p => { const d = p.t1 - p.t0; return { cena: 'est', de: { pos: [-1.5, 1.2, 6.5], alvo: [.6, 1.1, 0], fov: fov(32) }, ate: { pos: [-.5 + d * .55, 1.2, 6.0], alvo: [d * .55 + .8, 1.1, 0], fov: fov(30) }, ease: 'linear', mao: .4, carro: d }; },
    porta_amigos: p => ({ cena: 'tav', de: { pos: [1.15, 1.7, 5.4], alvo: [-.1, 1.35, 0], fov: fov(32) }, ate: { pos: [.95, 1.68, 4.8], alvo: [-.1, 1.4, 0], fov: fov(30) }, ease: 'lento', mao: .3 }),
    porta_contra: p => ({ cena: 'tav', de: { pos: [.35, 1.6, 1.5], alvo: [0, 1.62, 3], fov: fov(30) }, ate: { pos: [.25, 1.62, 1.85], alvo: [0, 1.62, 3], fov: fov(28) }, ease: 'lento', mao: .25 }),
    titulo: p => ({ cena: 'tit', de: { pos: [0, 0, 2], alvo: [0, 0, -3], fov: fov(35) }, ate: { pos: [0, 0, 1.6], alvo: [0, 0, -3], fov: fov(35) }, ease: 'lento', mao: .1, semCif: true }),
    cifrinho: p => ({ cena: 'tit', de: { pos: [.3, .1, 1.2], alvo: [0, -.1, -2.4], fov: fov(30) }, ate: { pos: [0, 0, .6], alvo: [0, -.05, -2.4], fov: fov(30) }, ease: 'lento', mao: .2, fadeOut: .8 }),
    grua_ferrovia: p => ({ cena: 'fer', de: { pos: [5, 8.5, 16], alvo: [0, .8, -4], fov: fov(42) }, ate: { pos: [2.6, 2.1, 6.4], alvo: [0, 1, 0], fov: fov(36) }, ease: 'inout', mao: .15 }),
    gage_close: p => ({ cena: 'fer', de: { pos: [.95, 1.66, 1.7], alvo: [0, 1.6, 0], fov: fov(28) }, ate: { pos: [.62, 1.63, 1.3], alvo: [0, 1.6, 0], fov: fov(27) }, ease: 'lento', mao: .3 }),
    travelling_corte: p => ({ cena: 'fer', de: { pos: [-1.5, 1.45, -14], alvo: [2, 1.1, -11.5], fov: fov(40) }, ate: { pos: [-1.5, 1.45, -5], alvo: [2, 1.1, -3], fov: fov(40) }, ease: 'linear', mao: .3, tamp: true }),
    furo_polvora: p => ({ cena: 'fer', de: { pos: [.55, .6, 1.2], alvo: [0, .3, .42], fov: fov(30) }, ate: { pos: [.4, .55, .95], alvo: [0, .32, .42], fov: fov(28) }, ease: 'lento', mao: .25, polvora: true }),
    barra_detalhe: p => ({ cena: 'fer', de: { pos: [-.95, .38, 1.15], alvo: [.2, .85, .3], fov: fov(32) }, ate: { pos: [-.75, .45, .95], alvo: [.2, .9, .3], fov: fov(30) }, ease: 'lento', mao: .3, tamp: true }),
    gage_vira: p => ({ cena: 'fer', de: { pos: [1.7, 1.35, 2.6], alvo: [0, 1.25, 0], fov: fov(32) }, ate: { pos: [1.45, 1.4, 2.25], alvo: [0, 1.35, 0], fov: fov(31) }, ease: 'lento', mao: .3, tamp: true, chama: true }),
    gage_vira_close: p => ({ cena: 'fer', de: { pos: [.5, 1.62, .9], alvo: [0, 1.6, 0], fov: fov(26) }, ate: { pos: [.36, 1.62, .66], alvo: [0, 1.6, 0], fov: fov(25) }, ease: 'inout', mao: .35, vira: true }),
    faisca: p => ({ cena: 'fer', de: { pos: [.42, .42, .95], alvo: [0, .3, .42], fov: fov(30) }, ate: { pos: [.36, .4, .82], alvo: [0, .3, .42], fov: fov(29) }, ease: 'lento', mao: .4, bate: true, fadeOut: .01 }),
  };
  const planos = F.planos.map(p => ({ ...p, ...(TIROS[p.tiro] ?? TIROS.titulo)(p) }));
  C.cenarios(S, CEN, planos);
  C.rodaCamera(S, planos);

  // ════════════ ANIMAÇÃO POR PLANO ════════════
  const pAt = t => planos.find(x => t >= x.t0 && t < x.t1) ?? planos[planos.length - 1];
  S.update.push(t => {
    const p = pAt(t), k = C.clamp((t - p.t0) / Math.max(.01, p.t1 - p.t0)), dt = t - p.t0;
    // ferrovia
    raios.forEach(r => r.anima(t)); poFer.anima(t); poN.anima(t); poT.anima(t); poTit.anima(t); feixePorta.anima(t); feixeTit.anima(t);
    lampN.tremula(t); lampE.tremula(t); lampTit.tremula(t); luzDentro.tremula(t, .08);
    // socar a barra: sobe e desce num ritmo pesado
    const soca = p.tamp ? Math.max(0, Math.sin(dt * 3.2)) : 0;
    barra.position.y = .32 + soca * .32; gage.partes.tronco.rotation.x = .12 + soca * .06;
    gage.partes.bracos.forEach(b => b.rotation.x = -1.15 + soca * .35);
    // pólvora
    polvorinho.visible = !!p.polvora; graos.visible = !!p.polvora; barra.visible = !p.polvora || true;
    if (p.polvora) { polvorinho.rotation.z = .9 + Math.sin(dt) * .05; const a = graos.geometry.attributes.position; for (let i = 0; i < 60; i++) { const f = ((dt * 1.6 + i / 60) % 1); a.setXYZ(i, .05 + Math.sin(i * 7) * .006, .52 - f * .22, .42 + Math.cos(i * 5) * .006); } a.needsUpdate = true; barra.position.y = .9; }
    // alguém chama: Gage para e vira a cabeça para a esquerda dele
    const vira = p.vira ? C.EASE.inout(C.clamp((k - .2) / .6)) : 0;
    gage.partes.cab.rotation.y = p.vira ? vira * .9 : (p.bate ? .9 : 0);
    op1.partes.bracos[1].rotation.x = p.chama ? -2.6 + Math.sin(dt * 5) * .15 : 0;
    // a batida: a barra desce, faísca, clarão, preto
    faiscas.visible = !!p.bate; luzFaisca.intensity = 0; S.U.uFlash.value = 0;
    if (p.bate) {
      const desce = C.clamp(k / .5); barra.position.y = .32 + (1 - C.EASE.entra(desce)) * .4;
      const kf = C.clamp((k - .5) / .5); const a = faiscas.geometry.attributes.position;
      for (let i = 0; i < nF; i++) { const v = faiscaV[i]; a.setXYZ(i, v[0] * kf * .5, .31 + v[1] * kf * .5 - 1.6 * kf * kf * .25, .42 + v[2] * kf * .5); }
      a.needsUpdate = true; faiscas.material.opacity = kf > 0 ? 1 : 0;
      luzFaisca.intensity = kf > 0 ? 25 * (1 - kf * .5) : 0;
      S.U.uFlash.value = k > .62 ? C.clamp((k - .62) / .12) : 0;
    }
    // céu: a barra gira no ar
    if (p.voo) {
      const v = p.voo === 2 ? k : k;
      barraC.position.set(-1.6 + v * 4.5, .8 + v * 4.2 - v * v * 1.2, -1 - v * 2);
      barraC.rotation.set(v * 9, .4, v * 13);
      fumaca.forEach((f, i) => { const u = f.userData, s = (p.voo === 1 ? k : k) * u.v; f.position.set(u.x * (1 + s), -.2 + s * 1.6, u.z - 1); f.scale.setScalar(u.s * (.3 + s * 1.4)); f.rotation.set(s, s * .7, 0); });
    }
    // carroça andando
    if (p.carro != null) { const x = dt * .55; carroca.position.x = x; carroca.rodas.forEach(r => r.rotation.y = -x / .42); carroca.boi.pernas.forEach((pe, i) => pe.rotation.z = Math.sin(dt * 5 + i * Math.PI / 2 + (i > 1 ? Math.PI : 0)) * .35); lampE.rotation.z = Math.sin(dt * 2.2) * .15; gageC.partes.cab.rotation.y = .3 + Math.sin(dt * 1.3) * .25; carroca.position.y = Math.abs(Math.sin(dt * 6)) * .015; }
    // Cifrinho flutua e fala
    cif.visible = !p.semCif; cif.position.y = -.15 + Math.sin(t * 2) * .05; cif.anel.rotation.z = t * .8; cif.rotation.y = Math.sin(t * .7) * .25;
    // fades
    let fade = 0;
    if (p.fadeIn) fade = Math.max(fade, 1 - C.clamp(dt / p.fadeIn));
    if (p.fadeOut) fade = Math.max(fade, C.clamp((t - (p.t1 - p.fadeOut)) / p.fadeOut));
    if (p.bate && k > .74) fade = Math.max(fade, C.clamp((k - .74) / .06));
    S.U.uFade.value = fade;
  });

  // ════════════ SOBREPOSIÇÕES ════════════
  const marcas = [];
  for (const p of planos) {
    const lista = p.marcas ?? (p.marca ? [p.marca] : []);
    lista.forEach((m, i) => marcas.push({ ...m, t0: p.t0 + .35 + i * .5, t1: p.t1 - .1, ...(VERT && m.x != null ? { x: Math.min(m.x, 55), y: m.y + 8 } : {}) }));
  }
  C.sobreposicoes({ palavras: F.palavras, marcas, tarja: !VERT });
};
